quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
%dev.quarkus.flyway.locations=db/migration,db/seed
%test.quarkus.flyway.locations=db/migration,db/seed
# NoteListQueryCountTest counts prepared statements to guard against N+1 queries.
%test.quarkus.hibernate-orm.statistics=true

learninghub.note.body-max-bytes=102400
%dev.learninghub.dev.current-user-id=00000000-0000-0000-0000-00000000000a

# Writes openapi.yaml/json at build time so API changes show up in review diffs.
quarkus.smallrye-openapi.store-schema-directory=docs/openapi
