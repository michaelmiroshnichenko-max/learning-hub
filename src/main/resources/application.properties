quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
%dev.quarkus.flyway.locations=db/migration,db/dev-seed
# Fixed port and db name so the MCP server can reach the dev database; the init script adds a read-only role.
%dev.quarkus.datasource.devservices.port=5433
%dev.quarkus.datasource.devservices.db-name=learninghub
%dev.quarkus.datasource.devservices.init-script-path=dev/mcp-readonly.sql
%test.quarkus.flyway.locations=db/migration,db/seed
# NoteListQueryCountTest counts prepared statements to guard against N+1 queries.
%test.quarkus.hibernate-orm.statistics=true

learninghub.note.body-max-bytes=102400
%dev.learninghub.dev.current-user-id=00000000-0000-0000-0000-00000000000d

# Writes openapi.yaml/json at build time so API changes show up in review diffs.
quarkus.smallrye-openapi.store-schema-directory=docs/openapi
